<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Veículos</title>
</head>
<body>
    <h1>Veículos Cadastrados</h1>
    
    <a th:href="@{/veiculos/novo}">Cadastrar Novo Veículo</a>
    <br><br>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Placa</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Cor</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="v : ${veiculos}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.placa}"></td>
                <td th:text="${v.marca}"></td>
                <td th:text="${v.modelo}"></td>
                <td th:text="${v.ano}"></td>
                <td th:text="${v.cor}"></td>
                <td>
                    <a th:href="@{/veiculos/{id}/editar(id=${v.id})}">Editar</a>
                    <form th:action="@{/veiculos/{id}/excluir(id=${v.id})}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Tem a certeza que deseja excluir?');">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <br>
    <a th:href="@{/}">Voltar ao Início (Reservas)</a>
</body>
</html>
