<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pessoas</title>
</head>
<body>
    <h1>Pessoas Cadastradas</h1>
    
    <a th:href="@{/pessoas/novo}">Cadastrar Nova Pessoa</a>
    <br><br>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${pessoas}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nome}"></td>
                <td th:text="${p.cpf}"></td>
                <td th:text="${p.email}"></td>
                <td>
                    <a th:href="@{/pessoas/{id}/editar(id=${p.id})}">Editar</a>
                    <form th:action="@{/pessoas/{id}/excluir(id=${p.id})}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Tem a certeza que deseja excluir?');">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
